<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trip Planner</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<header>

    <nav class="navbar">

        <h2>
            Smart Travel Guide
        </h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>

</header>


<section class="search-section">

    <h2>
        Create Your Trip
    </h2>


    <div class="form-container">


        <input
            type="text"
            id="destination"
            placeholder="Destination"
        >


        <input
            type="number"
            id="people"
            placeholder="Number of people"
            min="1"
        >


        <input
            type="number"
            id="days"
            placeholder="Number of days"
            min="1"
        >


        <input
            type="number"
            id="budget"
            placeholder="Budget"
            min="1"
        >


        <input
            type="text"
            id="preferences"
            placeholder="Preferences e.g. historical, nature"
        >


        <button onclick="createTrip()">
            Create Trip
        </button>


        <p id="message"></p>

    </div>

</section>


<script src="js/planner.js"></script>

</body>

</html>
